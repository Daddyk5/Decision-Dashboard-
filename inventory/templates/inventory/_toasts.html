{% if messages %}<div class="fixed right-4 top-4 z-50 flex w-[min(92vw,380px)] flex-col gap-3" role="status" aria-live="polite">{% for message in messages %}<div data-toast class="flex items-start gap-3 rounded-xl border p-4 text-sm shadow-2xl {% if message.tags == 'error' %}border-red-200 bg-red-50 text-alert{% elif message.tags == 'warning' %}border-amber-200 bg-amber-50 text-amber-700{% else %}border-emerald-200 bg-emerald-50 text-emerald-800{% endif %}"><p class="flex-1 font-medium">{{ message }}</p><button type="button" data-toast-close class="text-lg leading-none opacity-60 hover:opacity-100" aria-label="Dismiss notification">&times;</button></div>{% endfor %}</div>{% endif %}
<script>document.querySelectorAll('[data-toast]').forEach(function(t){var hide=function(){t.style.transition='opacity .3s';t.style.opacity='0';setTimeout(function(){t.remove()},300)};t.querySelector('[data-toast-close]').addEventListener('click',hide);setTimeout(hide,5000)});</script>
