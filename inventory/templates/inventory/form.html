<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title }}</title><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={theme:{extend:{colors:{navy:'#0B2545',slateblue:'#134074',canvas:'#EEF4F8'}}}};</script></head><body class="min-h-screen bg-canvas text-slate-700"><main class="mx-auto max-w-2xl px-5 py-8"><a href="{% url back_url %}" class="text-sm font-semibold text-slateblue">← Back</a><section class="mt-4 rounded-xl border border-slate-200 bg-white p-6 shadow-sm"><h1 class="text-2xl font-semibold text-navy">{{ title }}</h1><form method="post" class="mt-6 space-y-4">{% csrf_token %}{% if form.non_field_errors %}<div class="rounded-lg bg-red-50 p-3 text-sm text-red-700">{{ form.non_field_errors }}</div>{% endif %}{% for field in form %}<label class="block text-sm font-medium text-slate-600">{{ field.label }}{{ field }}{% if field.errors %}<span class="mt-1 block text-xs text-red-600">{{ field.errors|striptags }}</span>{% endif %}</label>{% endfor %}<button class="rounded-lg bg-navy px-4 py-3 text-sm font-semibold text-white hover:bg-slateblue">Save</button></form></section></main><style>input,select,textarea{display:block;width:100%;margin-top:.4rem;border:1px solid #cbd5e1;border-radius:.5rem;padding:.65rem;color:#0B2545;outline:none}input:focus,select:focus,textarea:focus{border-color:#134074;box-shadow:0 0 0 3px #8DA9C433}</style></body></html>
